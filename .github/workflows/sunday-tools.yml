name: Sunday self-hosted tools image

on:
  push:
    tags: ["tools-v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version without the tools-v prefix"
        required: true

concurrency:
  group: sunday-tools-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE_NAME: ${{ vars.GHCR_TOOLS_IMAGE != '' && vars.GHCR_TOOLS_IMAGE || 'ghcr.io/geojofori/buzz-tools' }}

jobs:
  build:
    name: Build and attest linux/amd64 tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound tools source
        id: source
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#tools-v}}"
          expected_ref="refs/tags/tools-v${version}"
          test "${GITHUB_REF}" = "${expected_ref}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${expected_ref}")"
          object_type="$(git cat-file -t "${expected_ref}")"
          test "${object_type}" = tag || test "${object_type}" = commit
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract immutable metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.source.outputs.version }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=Buzz self-hosted tools
            org.opencontainers.image.description=Extraction-only Buzz CLI and NIP-98 Git credential helper
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push tools image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile.tools
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}-buildcache:amd64
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}-buildcache:amd64,mode=max,compression=zstd

      - name: Extract and bind exact image binaries
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/buzz-tools-linux-amd64"
          container="sunday-tools-extract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker container rm --force "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          install -d -m 0700 "${output}"
          docker pull --platform linux/amd64 "${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker create --name "${container}" --platform linux/amd64 "${IMAGE_NAME}@${IMAGE_DIGEST}" /buzz --version
          docker cp "${container}:/buzz" "${output}/buzz"
          docker cp "${container}:/git-credential-nostr" "${output}/git-credential-nostr"
          chmod 0555 "${output}/buzz" "${output}/git-credential-nostr"
          file "${output}/buzz" "${output}/git-credential-nostr" | grep -c 'ELF 64-bit.*x86-64' | grep -qx 2
          "${output}/buzz" --version >"${output}/buzz-version.txt"
          (
            cd "${output}"
            sha256sum buzz git-credential-nostr > SHA256SUMS
          )
          jq -n \
            --arg image "${IMAGE_NAME}" \
            --arg image_digest "${IMAGE_DIGEST}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg source_tag "tools-v${SOURCE_VERSION}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg buzz_sha256 "$(sha256sum "${output}/buzz" | cut -d' ' -f1)" \
            --arg helper_sha256 "$(sha256sum "${output}/git-credential-nostr" | cut -d' ' -f1)" \
            --argjson buzz_bytes "$(stat -c %s "${output}/buzz")" \
            --argjson helper_bytes "$(stat -c %s "${output}/git-credential-nostr")" \
            '{schema_version:1,image:$image,image_digest:$image_digest,source_commit:$source_commit,source_tag:$source_tag,workflow_run_id:($workflow_run_id|tonumber),binaries:{buzz:{sha256:$buzz_sha256,bytes:$buzz_bytes},"git-credential-nostr":{sha256:$helper_sha256,bytes:$helper_bytes}}}' \
            | jq -cS . >"${output}/binary-manifest.json"

      - name: Attest tools image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload exact tools artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-tools-linux-amd64
          path: ${{ runner.temp }}/buzz-tools-linux-amd64
          if-no-files-found: error
          retention-days: 30

      - name: Publish summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Sunday tools image'
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo 'Tags:'
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
